<section id="view-profile" class="page-section">
  <div class="section-header">
    <div>
      <h2>Hồ sơ Cá nhân</h2>
      <p>Thông tin tài khoản xác thực qua Amazon Cognito</p>
    </div>
  </div>

  
  <div class="card">
    <div class="card-header">
      <h3>Chi tiết Tài khoản</h3>
    </div>
    <div class="card-body">
      <div class="profile-grid">
        <div class="profile-field">
          <span class="profile-label">Mã định danh (Cognito Sub)</span>
          <span class="profile-value col-mono" id="prof-id">-</span>
        </div>
        <div class="profile-field">
          <span class="profile-label">Tên đăng nhập</span>
          <span class="profile-value" id="prof-username">-</span>
        </div>
        <div class="profile-field">
          <span class="profile-label">Họ và tên</span>
          <span class="profile-value" id="prof-fullname">-</span>
        </div>
        <div class="profile-field">
          <span class="profile-label">Email liên hệ</span>
          <span class="profile-value col-mono" id="prof-email">-</span>
        </div>
        <div class="profile-field">
          <span class="profile-label">Vai trò hệ thống</span>
          <span class="profile-value" id="prof-role">-</span>
        </div>
        <div class="profile-field">
          <span class="profile-label">Trạng thái hoạt động</span>
          <span class="profile-value" id="prof-status">-</span>
        </div>
      </div>
    </div>
  </div>
</section>
