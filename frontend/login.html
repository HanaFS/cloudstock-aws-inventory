<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - CloudStock</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <h1>CloudStock</h1>
      <p>Hệ thống Quản lý Kho Serverless</p>
    </div>

    <div id="login-error" class="login-error"></div>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="login-username">Tên đăng nhập / Email</label>
        <input
          type="text"
          id="login-username"
          class="form-input"
          placeholder="Nhập email hoặc username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Mật khẩu</label>
        <input
          type="password"
          id="login-password"
          class="form-input"
          placeholder="Nhập mật khẩu"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="btn-login">
        Đăng nhập
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
