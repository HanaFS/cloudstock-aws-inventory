<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudStock – Quản lý Kho Serverless</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/inventory.css">
  <link rel="stylesheet" href="css/reports.css">
  <link rel="stylesheet" href="css/users.css">
</head>
<body>
<script>
  (function() {
    try {
      if (localStorage.getItem("sidebar_collapsed") === "true") {
        document.documentElement.classList.add("sidebar-collapsed");
      }
    } catch (e) {}
  })();
</script>

<div class="app-wrapper">
  
  <aside class="sidebar" id="app-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-content">
        <div class="sidebar-brand-icon" title="CloudStock">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
          </svg>
        </div>
        <div class="sidebar-brand-text">
          <h1>CloudStock</h1>
          <span>Serverless Inventory</span>
        </div>
      </div>
      <button type="button" class="sidebar-arrow-btn" id="sidebar-collapse-btn" title="Thu gọn sidebar (Ctrl+B)" aria-label="Thu gọn sidebar">
        <svg class="arrow-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group">
        <span class="nav-group-label">Tổng quan</span>
        <a class="nav-item active" data-view="dashboard" data-tooltip="Tổng quan" title="Tổng quan">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9"></rect>
            <rect x="14" y="3" width="7" height="5"></rect>
            <rect x="14" y="12" width="7" height="9"></rect>
            <rect x="3" y="16" width="7" height="5"></rect>
          </svg>
          <span class="nav-text">Tổng quan</span>
        </a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Danh mục</span>
        <a class="nav-item" data-view="products" data-tooltip="Hàng hóa" title="Hàng hóa">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span class="nav-text">Hàng hóa</span>
        </a>
        <a class="nav-item" data-view="suppliers" data-tooltip="Nhà cung cấp" title="Nhà cung cấp">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="3" width="15" height="13"></rect>
            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
            <circle cx="5.5" cy="18.5" r="2.5"></circle>
            <circle cx="18.5" cy="18.5" r="2.5"></circle>
          </svg>
          <span class="nav-text">Nhà cung cấp</span>
        </a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Nghiệp vụ Kho</span>
        <a class="nav-item" data-view="inventory" data-tooltip="Nghiệp vụ Kho" title="Nghiệp vụ Kho">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
          <span class="nav-text">Nghiệp vụ Kho</span>
        </a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Báo cáo &amp; Tra cứu</span>
        <a class="nav-item" data-view="reports" data-tooltip="Báo cáo &amp; Logs" title="Báo cáo &amp; Logs">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span class="nav-text">Báo cáo &amp; Logs</span>
        </a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Hệ thống</span>
        <a class="nav-item" data-view="profile" data-tooltip="Hồ sơ cá nhân" title="Hồ sơ cá nhân">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="nav-text">Hồ sơ cá nhân</span>
        </a>
        <a class="nav-item admin-only hidden" data-view="users" data-tooltip="Quản lý Người dùng" title="Quản lý Người dùng">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span class="nav-text">Quản lý Người dùng</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user-info">
        <div class="sidebar-user-avatar" id="sidebar-user-avatar" title="Người dùng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="sidebar-user-details">
          <span class="sidebar-user-name" id="sidebar-user-name">Đang tải...</span>
          <span class="sidebar-user-role" id="sidebar-user-role">...</span>
        </div>
      </div>
      <div>
        <button type="button" class="sidebar-logout" id="sidebar-btn-logout" title="Đăng xuất" data-tooltip="Đăng xuất">
          <svg class="logout-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span class="logout-text">Đăng xuất</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="main-area">
    <header class="header">
      <div class="header-left">
        <button type="button" class="header-menu-btn" id="header-menu-toggle" title="Bật/tắt thanh điều hướng (Ctrl+B)" aria-label="Toggle Navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="header-title" id="page-title">Tổng quan (Dashboard)</div>
      </div>
      <div class="header-right">
        <div class="header-user">
          <span id="header-user-name">...</span>
          <span id="header-user-role" class="header-role-badge">...</span>
        </div>
        <button type="button" class="header-logout" id="btn-logout">Đăng xuất</button>
      </div>
    </header>

    <main class="content" id="main-content">
      <div class="view-loading-box">
        <span class="spinner"></span>
        <span>Đang nạp các phân hệ hệ thống...</span>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


<script src="js/config.js?v=4"></script>
<script src="js/mockData.js?v=4"></script>
<script src="js/api.js?v=4"></script>
<script src="js/auth.js?v=4"></script>
<script src="js/dashboard.js?v=4"></script>
<script src="js/products.js?v=4"></script>
<script src="js/suppliers.js?v=4"></script>
<script src="js/inventory.js?v=4"></script>
<script src="js/reports.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
