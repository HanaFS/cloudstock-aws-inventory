<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudStock – Quản lý Kho Serverless</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/inventory.css">
  <link rel="stylesheet" href="css/reports.css">
  <link rel="stylesheet" href="css/users.css">
</head>
<body>

<div class="app-wrapper">
  
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>CloudStock</h1>
      <span>Serverless Inventory</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group">
        <span class="nav-group-label">Tổng quan</span>
        <a class="nav-item active" data-view="dashboard">Tổng quan</a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Danh mục</span>
        <a class="nav-item" data-view="products">Hàng hóa</a>
        <a class="nav-item" data-view="suppliers">Nhà cung cấp</a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Nghiệp vụ Kho</span>
        <a class="nav-item" data-view="inventory">Nghiệp vụ Kho</a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Báo cáo &amp; Tra cứu</span>
        <a class="nav-item" data-view="reports">Báo cáo &amp; Logs</a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Hệ thống</span>
        <a class="nav-item" data-view="profile">Hồ sơ cá nhân</a>
        <a class="nav-item admin-only hidden" data-view="users">Quản lý Người dùng</a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <span class="sidebar-user-name" id="sidebar-user-name">Đang tải...</span>
      <span class="sidebar-user-role" id="sidebar-user-role">...</span>
      <div>
        <button type="button" class="sidebar-logout" id="sidebar-btn-logout">Đăng xuất</button>
      </div>
    </div>
  </aside>

  <div class="main-area">
    <header class="header">
      <div class="header-title" id="page-title">Tổng quan (Dashboard)</div>
      <div class="header-right">
        <div class="header-user">
          <span id="header-user-name">...</span>
          <span id="header-user-role" class="header-role-badge">...</span>
        </div>
        <button type="button" class="header-logout" id="btn-logout">Đăng xuất</button>
      </div>
    </header>

    <main class="content" id="main-content">
      <div class="view-loading-box">
        <span class="spinner"></span>
        <span>Đang nạp các phân hệ hệ thống...</span>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


<script src="js/config.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/products.js"></script>
<script src="js/suppliers.js"></script>
<script src="js/inventory.js"></script>
<script src="js/reports.js"></script>
<script src="js/app.js"></script>
</body>
</html>
