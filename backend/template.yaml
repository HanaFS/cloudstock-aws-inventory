AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CloudStock serverless backend foundation

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  FrontendOrigin:
    Type: String
    Default: http://localhost:8080
    Description: Exact frontend origin allowed by API CORS.
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
    ConstraintDescription: Use 1-63 lowercase letters, numbers, or hyphens; do not start or end with a hyphen.
    Description: Globally unique prefix for the Cognito Hosted UI domain.

Conditions:
  IsProduction: !Equals
    - !Ref Stage
    - prod

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        STAGE: !Ref Stage
        FRONTEND_ORIGIN: !Ref FrontendOrigin
        DYNAMODB_ENDPOINT: ""

Resources:
  CloudStockUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub cloudstock-${Stage}
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  CloudStockUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub cloudstock-${Stage}-frontend
      UserPoolId: !Ref CloudStockUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub "${FrontendOrigin}/login.html"
      LogoutURLs:
        - !Sub "${FrontendOrigin}/login.html"
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CloudStockUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CloudStockUserPool

  CloudStockAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      Description: CloudStock administrators
      UserPoolId: !Ref CloudStockUserPool

  CloudStockStaffGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Staff
      Description: CloudStock warehouse staff
      UserPoolId: !Ref CloudStockUserPool

  CloudStockApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub cloudstock-${Stage}
      StageName: !Ref Stage
      EndpointConfiguration: REGIONAL
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CloudStockUserPool.Arn
      Cors:
        AllowOrigin: !Sub "'${FrontendOrigin}'"
        AllowHeaders: "'Content-Type,Authorization,Idempotency-Key'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        MaxAge: "'600'"

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.health.handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.products.handler
      Environment:
        Variables:
          PRODUCTS_TABLE: !Ref ProductsTable
          SUPPLIERS_TABLE: !Ref SuppliersTable
          TRANSACTIONS_TABLE: !Ref TransactionsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
              Resource: !GetAtt ProductsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt SuppliersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt TransactionsTable.Arn
      Events:
        ListProducts:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /products
            Method: GET
        CreateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /products
            Method: POST
        ReadProduct:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /products/{productId}
            Method: GET
        UpdateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /products/{productId}
            Method: PUT
        DeleteProduct:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /products/{productId}
            Method: DELETE

  SuppliersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.suppliers.handler
      Environment:
        Variables:
          SUPPLIERS_TABLE: !Ref SuppliersTable
          PRODUCTS_TABLE: !Ref ProductsTable
          TRANSACTIONS_TABLE: !Ref TransactionsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
              Resource: !GetAtt SuppliersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt ProductsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt TransactionsTable.Arn
      Events:
        ListSuppliers:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /suppliers
            Method: GET
        CreateSupplier:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /suppliers
            Method: POST
        ReadSupplier:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /suppliers/{supplierId}
            Method: GET
        UpdateSupplier:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /suppliers/{supplierId}
            Method: PUT
        DeleteSupplier:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /suppliers/{supplierId}
            Method: DELETE

  TransactionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.transactions.handler
      Environment:
        Variables:
          TRANSACTIONS_TABLE: !Ref TransactionsTable
          PRODUCTS_TABLE: !Ref ProductsTable
          SUPPLIERS_TABLE: !Ref SuppliersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt ProductsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt TransactionsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub "${TransactionsTable.Arn}/index/ByTimestamp"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt SuppliersTable.Arn
      Events:
        ListTransactions:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /transactions
            Method: GET
        CreateTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /transactions
            Method: POST
        ReadTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /transactions/{transactionId}
            Method: GET

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloudstock-${Stage}-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]

  SuppliersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloudstock-${Stage}-suppliers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: supplierId
          AttributeType: S
      KeySchema:
        - AttributeName: supplierId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloudstock-${Stage}-transactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transactionId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: transactionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ByTimestamp
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]

Outputs:
  ApiBaseUrl:
    Description: CloudStock API base URL
    Value: !Sub https://${CloudStockApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CloudStockUserPool
  UserPoolClientId:
    Description: Cognito public app client ID
    Value: !Ref CloudStockUserPoolClient
  CognitoHostedUiDomain:
    Description: Cognito Hosted UI domain base URL
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  ProductsTableName:
    Value: !Ref ProductsTable
  SuppliersTableName:
    Value: !Ref SuppliersTable
  TransactionsTableName:
    Value: !Ref TransactionsTable
