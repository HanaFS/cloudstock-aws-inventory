AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CloudStock serverless backend foundation

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  FrontendOrigin:
    Type: String
    Default: https://d7omav63h53i1.cloudfront.net
    Description: Exact frontend origin allowed by API CORS.
  CognitoDomainPrefix:
    Type: String
    Default: cloudstock-nhom4-202600
    AllowedPattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
    ConstraintDescription: Use 1-63 lowercase letters, numbers, or hyphens; do not start or end with a hyphen.
    Description: Globally unique prefix for the Cognito Hosted UI domain.

Conditions:
  IsProduction: !Equals
    - !Ref Stage
    - prod

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        STAGE: !Ref Stage
        FRONTEND_ORIGIN: !Ref FrontendOrigin
        DYNAMODB_ENDPOINT: ""

Resources:
  CloudStockUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub cloudstock-${Stage}
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  CloudStockUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub cloudstock-${Stage}-frontend
      UserPoolId: !Ref CloudStockUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub "${FrontendOrigin}/login.html"
      LogoutURLs:
        - !Sub "${FrontendOrigin}/login.html"
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CloudStockUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CloudStockUserPool

  CloudStockAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      Description: CloudStock administrators
      UserPoolId: !Ref CloudStockUserPool

  CloudStockStaffGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Staff
      Description: CloudStock warehouse staff
      UserPoolId: !Ref CloudStockUserPool

  CloudStockApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub cloudstock-${Stage}
      StageName: !Ref Stage
      EndpointConfiguration: REGIONAL
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CloudStockUserPool.Arn
      Cors:
        AllowOrigin: !Sub "'${FrontendOrigin}'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,Idempotency-Key'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        MaxAge: "'600'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,Idempotency-Key'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,Idempotency-Key'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.health.handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.catalog.handler
      Environment:
        Variables:
          TABLE_PRODUCTS: !Ref ProductsTable
          TABLE_SUPPLIERS: !Ref SuppliersTable
          TABLE_TRANSACTIONS: !Ref TransactionsTable
          BUCKET_NAME: !Ref ProductAssetsBucket
          PRODUCT_IMAGE_BASE_URL: !Sub "https://${ProductAssetsBucket}.s3.${AWS::Region}.amazonaws.com"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
              Resource: !GetAtt ProductsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
              Resource: !GetAtt SuppliersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt TransactionsTable.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${ProductAssetsBucket.Arn}/products/*"
      Events:
        ListProducts:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /products
            Method: GET
        CreateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /products
            Method: POST
        ReadProduct:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /products/{productId}
            Method: GET
        UpdateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /products/{productId}
            Method: PUT
        DeleteProduct:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /products/{productId}
            Method: DELETE
        ListSuppliers:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /suppliers
            Method: GET
        CreateSupplier:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /suppliers
            Method: POST
        ReadSupplier:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /suppliers/{supplierId}
            Method: GET
        UpdateSupplier:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /suppliers/{supplierId}
            Method: PUT
        DeleteSupplier:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /suppliers/{supplierId}
            Method: DELETE
        ProductImageUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /products/upload-url
            Method: POST

  TransactionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.transactions.handler
      Environment:
        Variables:
          TABLE_TRANSACTIONS: !Ref TransactionsTable
          TABLE_PRODUCTS: !Ref ProductsTable
          TABLE_SUPPLIERS: !Ref SuppliersTable
          BUCKET_NAME: !Ref ProductAssetsBucket
          LOG_GROUPS: !Sub "/aws/lambda/${AWS::StackName}-UsersFunction,/aws/lambda/${AWS::StackName}-DashboardFunction,/aws/lambda/${AWS::StackName}-ProductsFunction,/aws/lambda/${AWS::StackName}-TransactionsFunction"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt ProductsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
              Resource: !GetAtt TransactionsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub "${TransactionsTable.Arn}/index/ByCreatedAt"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt SuppliersTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${ProductAssetsBucket.Arn}/invoices/*"
            - Effect: Allow
              Action:
                - logs:FilterLogEvents
              Resource:
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-UsersFunction:*"
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-DashboardFunction:*"
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-ProductsFunction:*"
                - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-TransactionsFunction:*"
      Events:
        ListTransactions:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /transactions
            Method: GET
        CreateTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /transactions
            Method: POST
        ReadTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /transactions/{transactionId}
            Method: GET
        InvoiceUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /transactions/invoice-upload-url
            Method: POST
        InvoiceDownloadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /transactions/{transactionId}/invoice-url
            Method: GET
        SystemLogs:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /logs
            Method: GET

  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.users.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref CloudStockUserPool
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminGetUser
                - cognito-idp:ListUsers
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminResetUserPassword
              Resource: !GetAtt CloudStockUserPool.Arn
      Events:
        ListUsers:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /users
            Method: GET
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /users
            Method: POST
        ReadUser:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /users/{userId}
            Method: GET
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /users/{userId}
            Method: PUT
        DeleteUser:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /users/{userId}
            Method: DELETE
        ResetUserPassword:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /users/{userId}/reset-password
            Method: POST

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.dashboard.handler
      Environment:
        Variables:
          TABLE_PRODUCTS: !Ref ProductsTable
          TABLE_SUPPLIERS: !Ref SuppliersTable
          TABLE_TRANSACTIONS: !Ref TransactionsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource:
                - !GetAtt ProductsTable.Arn
                - !GetAtt SuppliersTable.Arn
                - !GetAtt TransactionsTable.Arn
      Events:
        Dashboard:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /dashboard
            Method: GET
        DashboardStats:
          Type: Api
          Properties:
            RestApiId: !Ref CloudStockApi
            Path: /dashboard/stats
            Method: GET

  ProductAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "cloudstock-assets-${Stage}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendOrigin
            AllowedMethods:
              - POST
            AllowedHeaders:
              - "*"
            MaxAge: 600

  ProductImagesPublicReadPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProductAssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadProductImagesOnly
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${ProductAssetsBucket.Arn}/products/*"

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloudstock-${Stage}-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]

  SuppliersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloudstock-${Stage}-suppliers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: supplierId
          AttributeType: S
      KeySchema:
        - AttributeName: supplierId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloudstock-${Stage}-transactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transactionId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: transactionId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByCreatedAt
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]

Outputs:
  ApiBaseUrl:
    Description: CloudStock API base URL
    Value: !Sub https://${CloudStockApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CloudStockUserPool
  UserPoolClientId:
    Description: Cognito public app client ID
    Value: !Ref CloudStockUserPoolClient
  CognitoHostedUiDomain:
    Description: Cognito Hosted UI domain base URL
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  ProductsTableName:
    Value: !Ref ProductsTable
  SuppliersTableName:
    Value: !Ref SuppliersTable
  TransactionsTableName:
    Value: !Ref TransactionsTable
  ProductAssetsBucketName:
    Value: !Ref ProductAssetsBucket