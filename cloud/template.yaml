AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CloudStock - He thong quan ly kho & hang hoa Serverless (Nhom 4).
  Lambda + API Gateway (HTTP API) + DynamoDB + S3 + Cognito + CloudWatch.

Parameters:
  BucketName:
    Type: String
    Default: qlkho-assets-nhom4-2026
    Description: Ten bucket S3 (phai duy nhat tren toan the gioi).
  ResourceSuffix:
    Type: String
    Default: ""
    Description: >
      Hau to them vao ten bang / ham / user pool. De trong neu chua co tai nguyen cu.
      Neu da tao tay tren Console va bi trung ten thi dat vd "-iac".
  AlertEmail:
    Type: String
    Default: ""
    Description: Email nhan canh bao CloudWatch (de trong neu khong can).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        TABLE_PRODUCTS: !Ref ProductsTable
        TABLE_SUPPLIERS: !Ref SuppliersTable
        TABLE_TRANSACTIONS: !Ref TransactionsTable
        USER_POOL_ID: !Ref UserPool
        BUCKET_NAME: !Ref AssetsBucket

Resources:
  # ------------------------------------------------------------------
  # 1. DynamoDB (On-Demand)
  # ------------------------------------------------------------------
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Products${ResourceSuffix}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH

  SuppliersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Suppliers${ResourceSuffix}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: supplierId
          AttributeType: S
      KeySchema:
        - AttributeName: supplierId
          KeyType: HASH

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Transactions${ResourceSuffix}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: transactionId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: transactionId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: productId-createdAt-index
          KeySchema:
            - AttributeName: productId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ------------------------------------------------------------------
  # 2. S3: products/ cong khai (chi doc), invoices/ rieng tu
  # ------------------------------------------------------------------
  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadProductImagesOnly
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${AssetsBucket.Arn}/products/*"

  # ------------------------------------------------------------------
  # 3. Cognito: User Pool, App Client, 2 group Admin / Staff
  # ------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "qlkho-users${ResourceSuffix}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "qlkho-web${ResourceSuffix}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      IdTokenValidity: 12
      AccessTokenValidity: 12
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours
        RefreshToken: days

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      Description: Quan tri vien - toan quyen
      UserPoolId: !Ref UserPool

  StaffGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Staff
      Description: Nhan vien kho - them/sua, nhap/xuat
      UserPoolId: !Ref UserPool

  # ------------------------------------------------------------------
  # 4. API Gateway (HTTP API) + JWT Authorizer cua Cognito + CORS
  # ------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: CloudStock REST API
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 3600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  # ------------------------------------------------------------------
  # 5. Lambda Layer dung chung + 4 ham Lambda (moi ham 1 IAM role rieng)
  # ------------------------------------------------------------------
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "qlkho-common${ResourceSuffix}"
      Description: Khung dung chung (response CORS, Decimal, JWT user, clients boto3)
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  UsersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/api-users-handler${ResourceSuffix}"
      RetentionInDays: 14

  DashboardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/api-dashboard-handler${ResourceSuffix}"
      RetentionInDays: 14

  ProductsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/api-products-handler${ResourceSuffix}"
      RetentionInDays: 14

  TransactionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/api-transactions-handler${ResourceSuffix}"
      RetentionInDays: 14

  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "api-users-handler${ResourceSuffix}"
      Description: Module 1 - Quan ly tai khoan Cognito & phan quyen
      CodeUri: src/api_users_handler/
      Handler: app.lambda_handler
      LoggingConfig:
        LogGroup: !Ref UsersLogGroup
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminListGroupsForUser
              Resource: !GetAtt UserPool.Arn
      Events:
        UsersRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users
            Method: ANY
        UsersProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /users/{proxy+}
            Method: ANY

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "api-dashboard-handler${ResourceSuffix}"
      Description: Module 2 - Thong ke tong quan & du lieu bieu do
      CodeUri: src/api_dashboard_handler/
      Handler: app.lambda_handler
      LoggingConfig:
        LogGroup: !Ref DashboardLogGroup
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !GetAtt ProductsTable.Arn
                - !GetAtt SuppliersTable.Arn
                - !GetAtt TransactionsTable.Arn
                - !Sub "${TransactionsTable.Arn}/index/*"
      Events:
        Dashboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /dashboard
            Method: GET

  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "api-products-handler${ResourceSuffix}"
      Description: Module 3 - Hang hoa, nha cung cap, S3 pre-signed URL
      CodeUri: src/api_products_handler/
      Handler: app.lambda_handler
      LoggingConfig:
        LogGroup: !Ref ProductsLogGroup
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
                - !GetAtt ProductsTable.Arn
                - !GetAtt SuppliersTable.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub "${AssetsBucket.Arn}/products/*"
                - !Sub "${AssetsBucket.Arn}/invoices/*"
      Events:
        ProductsRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /products
            Method: ANY
        ProductsProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /products/{proxy+}
            Method: ANY
        SuppliersRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /suppliers
            Method: ANY
        SuppliersProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /suppliers/{proxy+}
            Method: ANY

  TransactionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "api-transactions-handler${ResourceSuffix}"
      Description: Module 4 & 5 - Nhap/Xuat kho, lich su giao dich, log CloudWatch
      CodeUri: src/api_transactions_handler/
      Handler: app.lambda_handler
      LoggingConfig:
        LogGroup: !Ref TransactionsLogGroup
      Environment:
        Variables:
          LOG_GROUP_NAMES: !Join
            - ","
            - - !Ref UsersLogGroup
              - !Ref DashboardLogGroup
              - !Ref ProductsLogGroup
              - !Ref TransactionsLogGroup
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt TransactionsTable.Arn
                - !Sub "${TransactionsTable.Arn}/index/*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProductsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt SuppliersTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "${AssetsBucket.Arn}/invoices/*"
            - Effect: Allow
              Action:
                - logs:FilterLogEvents
                - logs:GetLogEvents
                - logs:DescribeLogStreams
              Resource:
                - !GetAtt UsersLogGroup.Arn
                - !GetAtt DashboardLogGroup.Arn
                - !GetAtt ProductsLogGroup.Arn
                - !GetAtt TransactionsLogGroup.Arn
      Events:
        TransactionsRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transactions
            Method: ANY
        TransactionsProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transactions/{proxy+}
            Method: ANY

  # ------------------------------------------------------------------
  # 6. CloudWatch: canh bao + dashboard
  # ------------------------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "qlkho-alarms${ResourceSuffix}"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  UsersErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "api-users-handler-errors${ResourceSuffix}"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UsersFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  DashboardErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "api-dashboard-handler-errors${ResourceSuffix}"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DashboardFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ProductsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "api-products-handler-errors${ResourceSuffix}"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProductsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  TransactionsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "api-transactions-handler-errors${ResourceSuffix}"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TransactionsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "qlkho-api-5xx${ResourceSuffix}"
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "qlkho-nhom4${ResourceSuffix}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{
              "title":"Lambda - Invocations","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries",
              "metrics":[
                ["AWS/Lambda","Invocations","FunctionName","${UsersFunction}"],
                ["AWS/Lambda","Invocations","FunctionName","${DashboardFunction}"],
                ["AWS/Lambda","Invocations","FunctionName","${ProductsFunction}"],
                ["AWS/Lambda","Invocations","FunctionName","${TransactionsFunction}"]
              ]}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{
              "title":"Lambda - Errors","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries",
              "metrics":[
                ["AWS/Lambda","Errors","FunctionName","${UsersFunction}"],
                ["AWS/Lambda","Errors","FunctionName","${DashboardFunction}"],
                ["AWS/Lambda","Errors","FunctionName","${ProductsFunction}"],
                ["AWS/Lambda","Errors","FunctionName","${TransactionsFunction}"]
              ]}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{
              "title":"Lambda - Duration (ms, trung binh)","region":"${AWS::Region}","stat":"Average","period":300,"view":"timeSeries",
              "metrics":[
                ["AWS/Lambda","Duration","FunctionName","${UsersFunction}"],
                ["AWS/Lambda","Duration","FunctionName","${DashboardFunction}"],
                ["AWS/Lambda","Duration","FunctionName","${ProductsFunction}"],
                ["AWS/Lambda","Duration","FunctionName","${TransactionsFunction}"]
              ]}},
            {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{
              "title":"API Gateway - Requests / 4xx / 5xx","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries",
              "metrics":[
                ["AWS/ApiGateway","Count","ApiId","${HttpApi}"],
                ["AWS/ApiGateway","4xx","ApiId","${HttpApi}"],
                ["AWS/ApiGateway","5xx","ApiId","${HttpApi}"]
              ]}}
          ]
        }

Outputs:
  ApiBaseUrl:
    Description: Base URL cho Frontend (API_BASE_URL)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  BucketNameOut:
    Value: !Ref AssetsBucket
  ProductsTableName:
    Value: !Ref ProductsTable
  SuppliersTableName:
    Value: !Ref SuppliersTable
  TransactionsTableName:
    Value: !Ref TransactionsTable
  DashboardUrl:
    Description: Dashboard CloudWatch
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=qlkho-nhom4${ResourceSuffix}"
